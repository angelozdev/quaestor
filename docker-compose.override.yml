# Auto-merged with docker-compose.yml by Compose.
# `docker compose up` runs this dev stack by default.
#
# To run the production stack explicitly (skipping this override):
#   docker compose -f docker-compose.yml up -d
#
# To run the dev stack PLUS the prod-only services (rare):
#   docker compose --profile never up

services:
  api:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env.local
    environment:
      COOKIE_SECURE: "false"
    # Direct uvicorn CLI flags: explicit host/port + reload + reload-dir.
    command: >-
      uv run uvicorn quaestor.api:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./backend/scripts:/app/scripts:ro

  mcp:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env.local
    environment:
      MCP_RELOAD: "1"
    # Helper-based reload: quaestor.mcp.__main__ -> main() reads MCP_RELOAD
    # and turns on uvicorn autoreload. Asymmetric vs `api` (direct uvicorn
    # CLI flags) but intentional: MCP_RELOAD is the dev knob documented in
    # quaestor.mcp.server.main().
    command: ["uv", "run", "python", "-m", "quaestor.mcp"]
    ports:
      - "9000:9000"
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro

  frontend:
    # Use the deps stage so pnpm + node_modules are present in the image
    # (the prod runtime stage only carries .next/standalone).
    build:
      context: ./frontend
      target: deps
    env_file:
      - ./frontend/.env.local
    environment:
      # Override .env.local's host-dev URL with the in-network service
      # name. The proxy at /api/[...path] reads API_URL at request
      # time; left at the .env.local value of http://localhost:8000
      # it tries 127.0.0.1:8000 from inside the container and 500s
      # (ECONNREFUSED). API_INTERNAL_URL is the build-time arg used
      # by the standalone image for SSR fetches — keep both.
      API_URL: http://api:8000
      API_INTERNAL_URL: http://api:8000
    command: ["pnpm", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/ui:/app/ui
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/biome.json:/app/biome.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      # postcss.config.mjs registers @tailwindcss/postcss — without it,
      # `@import "tailwindcss"` is not expanded and Tailwind utilities
      # are never generated (page renders as raw HTML).
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - frontend_node_modules:/app/node_modules

  scheduler:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env.local
    command:
      - sh
      - -c
      - |
        trap 'exit 0' TERM INT
        echo 'scheduler ready (manual trigger only)'
        while true; do
          sleep 86400 &
          wait $$!
        done

  db:
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env.local

  # Inherited from docker-compose.yml but skipped in dev:
  caddy:
    profiles: ["never"]
  tailscale:
    profiles: ["never"]

volumes:
  frontend_node_modules:
