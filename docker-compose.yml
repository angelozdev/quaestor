# Quaestor local-only stack (ADR-0026, ADR-0030).
# Pick a DB profile by passing `--env-file`:
#   just dev-prod   → backend/.env.local.postgres (local Postgres = production)
#   just dev-local  → backend/.env.local.sqlite
#   just dev-real   → backend/.env.local.remote (Render standby)
services:
  db:
    image: postgres:18
    profiles: ["pg"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quaestor}
      # empty default keeps other profiles interpolating; postgres refuses to
      # boot without a password, so a missing env file still fails loudly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-quaestor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 image keeps PGDATA under /var/lib/postgresql (not .../data)
      - quaestor_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-quaestor} -d $${POSTGRES_DB:-quaestor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: quaestor-backend:latest
    command: ["python", "-m", "quaestor"]
    env_file:
      - ${QUAESTOR_ENV_FILE:?set QUAESTOR_ENV_FILE to backend/.env.local.sqlite or backend/.env.local.remote}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./.dev-data:/app/.dev-data
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c",
             "import httpx,os,sys; sys.exit(0 if httpx.get('http://localhost:8000/api/auth/me', headers={'Authorization': f'Bearer {os.environ[\"APP_TOKEN\"]}'}, timeout=5).status_code in (200,401) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: deps
    image: quaestor-frontend:latest
    command: ["pnpm", "dev"]
    env_file:
      - ${QUAESTOR_ENV_FILE}
    environment:
      API_URL: http://api:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/ui:/app/ui
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/biome.json:/app/biome.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
  quaestor_pg_data: