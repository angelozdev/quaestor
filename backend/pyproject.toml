[project]
name = "quaestor"
version = "0.1.0"
description = "Quaestor — personal finance backend (P0 core)"
requires-python = ">=3.12"
dependencies = ["sqlmodel>=0.0.22"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaestor"]
