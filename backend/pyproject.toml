[project]
name = "quaestor"
version = "0.1.0"
description = "Quaestor — personal finance backend (P0 core)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.137.2",
    "fastmcp>=3,<4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "litellm>=1.40",
    "mcp>=1.28,<2",
    "psycopg[binary]>=3.2",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaestor"]
